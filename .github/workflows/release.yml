name: Release seat-solver

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - platform: macos-x64
            runner: macos-26-intel
            target: x86_64-apple-darwin
          - platform: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - name: Build
        run: cargo +stable build --manifest-path cli/Cargo.toml --release --locked --target "$TARGET"
      - name: Sign macOS executable
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_BASE64:?APPLE_CERTIFICATE_BASE64 is required}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is required}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/signing.XXXXXX")
          keychain="$signing_dir/signing.keychain-db"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$signing_dir"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$signing_dir/certificate.p12"
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk 'index($0, "Developer ID Application: ") && index($0, "(" ENVIRON["APPLE_TEAM_ID"] ")") { print $2 }')
          if [[ ! "$identity" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo 'Expected one valid Developer ID Application identity for APPLE_TEAM_ID.' >&2
            exit 1
          fi
          executable="cli/target/$TARGET/release/seat-solver"
          codesign --force --sign "$identity" --keychain "$keychain" --options runtime --timestamp --identifier com.github.HotariTobu.event-sheet-tools.seat-solver "$executable"
          codesign --verify --strict --verbose=2 "$executable"
      - name: Package executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          $source = "cli/target/$env:TARGET/release/seat-solver.exe"
          $archive = Join-Path $destination "seat-solver-$env:PLATFORM.zip"
          Compress-Archive -LiteralPath $source -DestinationPath $archive -CompressionLevel Optimal
      - name: Package executable (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          cd "cli/target/$TARGET/release"
          zip -j "$RUNNER_TEMP/release/seat-solver-$PLATFORM.zip" seat-solver
      - name: Notarize macOS archive
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?APPLE_ID is required}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?APPLE_APP_SPECIFIC_PASSWORD is required}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required}"
          result="$RUNNER_TEMP/notarization.json"
          xcrun notarytool submit "$RUNNER_TEMP/release/seat-solver-$PLATFORM.zip" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$result"
          cat "$result"
          if ! jq -e '.status == "Accepted"' "$result" >/dev/null; then
            xcrun notarytool log "$(jq -r '.id' "$result")" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: seat-solver-${{ matrix.platform }}
          path: ${{ runner.temp }}/release/seat-solver-${{ matrix.platform }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Attach release archives
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: seat-solver-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Attach all six archives
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/release/seat-solver-windows-x64.zip
            ${{ runner.temp }}/release/seat-solver-windows-arm64.zip
            ${{ runner.temp }}/release/seat-solver-macos-x64.zip
            ${{ runner.temp }}/release/seat-solver-macos-arm64.zip
            ${{ runner.temp }}/release/seat-solver-linux-x64.zip
            ${{ runner.temp }}/release/seat-solver-linux-arm64.zip
