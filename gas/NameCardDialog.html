<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    body{margin:20px;font:14px system-ui,sans-serif;color:#30313b}
    #status{white-space:pre-wrap;overflow-wrap:anywhere}
    select,button{font:inherit;padding:6px;margin:0 12px 10px 4px}
    #layout{margin:0 0 14px;line-height:1.6}
  </style>
</head>
<body>
  <label>用紙<select id="paper"><option value="A4">A4</option><option value="A3">A3</option><option value="B5">B5（JIS）</option><option value="B4">B4（JIS）</option></select></label>
  <div id="layout"></div>
  <button id="create">シート作成</button>
  <div id="status" role="status" aria-live="polite"></div>
  <?!= HtmlService.createHtmlOutputFromFile('NameCardAssets').getContent() ?>
  <?!= HtmlService.createHtmlOutputFromFile('NameCardEmbedded').getContent() ?>
  <?!= HtmlService.createHtmlOutputFromFile('NameCardQr').getContent() ?>
  <?!= HtmlService.createHtmlOutputFromFile('NameCardGraphics').getContent() ?>
  <?!= HtmlService.createHtmlOutputFromFile('NameCardDraw').getContent() ?>
  <?!= HtmlService.createHtmlOutputFromFile('NameCardResources').getContent() ?>
  <script>
    const printLayouts=<?!= printLayouts ?>;
    const paper=document.getElementById('paper');
    const button=document.getElementById('create');
    const status=document.getElementById('status');
    function updatePrintLayout(){
      const layout=printLayouts[paper.value];
      document.getElementById('layout').textContent=layout.columns+'列 × '+layout.rows+'行（'+layout.columns*layout.rows+'枚／ページ）';
    }
    paper.addEventListener('change',updatePrintLayout);
    updatePrintLayout();
    function nameCardCall(method,...args){
      return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args));
    }
    function errorMessage(error){return error&&error.message||String(error);}
    function nameCardProgress(jobId,total){
      let stopped=false,timer=null,shown=0;
      async function poll(){
        try{
          const progress=await nameCardCall('getNameCardProgress',jobId);
          if(stopped)return;
          shown=Math.max(shown,progress.done);
          status.textContent='名刺を配置中：'+shown+'／'+total+'人'+(progress.errors.length?'\n'+progress.errors.join('\n'):'');
        }catch(error){if(!stopped)status.textContent='進捗取得エラー：'+errorMessage(error);}
        finally{if(!stopped)timer=setTimeout(poll,1000);}
      }
      status.textContent='名刺を配置中：0／'+total+'人';
      poll();
      return ()=>{stopped=true;if(timer!==null)clearTimeout(timer);};
    }
    async function createNameCards(){
      paper.disabled=button.disabled=true;
      let job=null,stopProgress=()=>{};
      try{
        status.textContent='回答を読み込み中…';
        const data=await nameCardCall('loadNameCardData');
        const resources=await nameCardLoadResources(data.people,message=>{status.textContent=message;});
        const cards=[];
        try{
          for(let index=0;index<data.people.length;index++){
            status.textContent='名刺画像を生成中：'+index+'／'+data.people.length+'人';
            await new Promise(resolve=>setTimeout(resolve,0));
            const person=data.people[index],rendered=NameCardDraw.render(person,resources);
            cards.push({index,nickname:person.nickname,row:person.row,blob:await nameCardPng(rendered.canvas)});
          }
        }finally{resources.dispose();}
        status.textContent='シートを準備中…';
        job=await nameCardCall('beginNameCardJob',{version:3,paper:paper.value,hash:data.hash});
        stopProgress=nameCardProgress(job.jobId,job.total);
        const results=await Promise.allSettled(job.batches.map(async batch=>{
          const images=await Promise.all(cards.slice(batch.start,batch.end).map(async card=>({index:card.index,nickname:card.nickname,row:card.row,bytes:Array.from(new Uint8Array(await card.blob.arrayBuffer()))})));
          return nameCardCall('runNameCardBatch',{jobId:job.jobId,batchIndex:batch.index,cards:images});
        }));
        stopProgress();
        const errors=Array.from(new Set(results.filter(result=>result.status==='rejected').map(result=>errorMessage(result.reason))));
        if(errors.length)throw new Error(errors.join('\n'));
        status.textContent='PDFリンクを設定中…';
        await nameCardCall('finishNameCardJob',job.jobId);
        job=null;
        google.script.host.close();
      }catch(error){
        stopProgress();
        let message=errorMessage(error);
        if(job){
          try{await nameCardCall('abortNameCardJob',job.jobId);}
          catch(cleanupError){message+='\n終了処理エラー：'+errorMessage(cleanupError);}
        }
        status.textContent='エラー：'+message;
        paper.disabled=button.disabled=false;
      }
    }
    button.addEventListener('click',createNameCards);
  </script>
</body>
</html>
