<script>

  // 平方因子の総当たり分解はせず、平方根の有理数倍の同値類を正規化する。

  function value(lo,hi,v,build) {

  function rat(n,d=1n) {

      (!u&&on(a,b,c)) || (!v&&on(a,b,d)) || (!w&&on(c,d,a)) || (!x&&on(c,d,b));
  }
  function Model(job) {

    this.n=this.people.length; this.m=job.works.length; this.k=this.seats.length;
    if(!this.n || !this.m) throw Error('参加者と作品が必要です。');
    if(this.n>this.k) throw Error('総席数が不足しています。参加者'+this.n+'人、座席'+this.k+'席。');

    this.seats.forEach(s=>{
      if(!Number.isSafeInteger(s.row)||s.row<1||!Number.isSafeInteger(s.col)||s.col<1||!String(s.table)) throw Error('座席位置・卓番号が不正です。');
      const key=s.row+':'+s.col; if(positions.has(key)||labels.has(s.label)) throw Error('座席位置または座席番号が重複しています。');
      positions.add(key); labels.add(s.label);

    this.people.forEach((p,i)=>{
      if(p.levels.length!==this.m || p.favorites.length!==this.m || p.levels.some(v=>!Number.isInteger(v)||v<1||v>5)) throw Error('作品レベルは全作品について1〜5が必要です。');

      if(phrase && phrases.has(phrase)) this.groups[phrases.get(phrase)].push(i);
      else { if(phrase) phrases.set(phrase,this.groups.length); this.groups.push([i]); }
    });

    const max=Math.max(...this.tables.map(t=>t.length));
    if(this.groups.some(g=>g.length>max)) throw Error('同伴者グループが最大の卓の定員を超えています。');
    this.delta=delta(this.ar,this.m); const common=Array.from({length:this.n},()=>Array(this.n).fill(0)); let C=0;
    for(let i=0;i<this.n;i++) for(let j=i+1;j<this.n;j++) {
      let c=0; for(let k=0;k<this.m;k++) {
        const a=new Set(this.people[i].favorites[k]),b=new Set(this.people[j].favorites[k]);
        for(const name of a) if(name && b.has(name)) c++;

      common[i][j]=common[j][i]=c; C=Math.max(C,c);
    }
    this.S=Array.from({length:this.n},()=>Array(this.n).fill(zero));
    for(let i=0;i<this.n;i++) for(let j=i+1;j<this.n;j++) {
      let N=0; for(let k=0;k<this.m;k++) N+=((this.people[i].levels[k]-1)**2-(this.people[j].levels[k]-1)**2)**2;
      this.S[i][j]=this.S[j][i]=plus(base(this.ar,N),times(this.ar,this.delta,rat(BigInt(common[i][j]),BigInt(C+1))));
    }
    const h=decimal(job.horizontal),v=decimal(job.vertical),den=h[1]*v[1],H=h[0]*v[1],V=v[0]*h[1];
    this.W=Array.from({length:this.k},()=>Array(this.k).fill(zero));
    for(let p=0;p<this.k;p++) for(let q=p+1;q<this.k;q++) {
      const a=this.seats[p],b=this.seats[q];

      const dx=H*BigInt(a.col-b.col),dy=V*BigInt(a.row-b.row),R=dx*dx+dy*dy;
      if(!R) throw Error('異なる座席が同じ位置にあります。');

    this.sortedPeople=this.S.map(row=>row.map((_,i)=>i).sort((a,b)=>-compare(this.ar,row[a],row[b])||a-b));
    this.sortedSeats=this.W.map(row=>row.map((_,i)=>i).sort((a,b)=>-compare(this.ar,row[a],row[b])||a-b));
  }
  Model.prototype.valid=function(pos,complete=true) {
    if(!Array.isArray(pos)||pos.length!==this.n) return false;
    const used=new Set();
    for(const p of pos) { if(p===-1&&!complete) continue; if(!Number.isInteger(p)||p<0||p>=this.k||used.has(p)) return false; used.add(p); }

  };
  Model.prototype.utilities=function(pos) {
    const u=Array(this.n).fill(zero);
    for(let i=0;i<this.n;i++) for(let j=i+1;j<this.n;j++) {
      const e=times(this.ar,this.S[i][j],this.W[pos[i]][pos[j]]); u[i]=plus(u[i],e); u[j]=plus(u[j],e);
    }

  };
  Model.prototype.score=function(pos) { return this.utilities(pos).sort((a,b)=>compare(this.ar,a,b)); };
  Model.prototype.cmp=function(a,b) {
    for(let k=0;k<a.length;k++) { const c=compare(this.ar,a[k],b[k]); if(c) return c; } return 0;
  };
  Model.prototype.upper=function(pos) {
    const used=new Set(pos.filter(p=>p>=0)),free=this.seats.map((_,p)=>p).filter(p=>!used.has(p)),upper=[];
    for(let i=0;i<this.n;i++) {
      let best=null; const others=this.sortedPeople[i].filter(j=>j!==i&&pos[j]<0);
      for(const p of pos[i]>=0?[pos[i]]:free) {

        for(let j=0;j<this.n;j++) if(j!==i&&pos[j]>=0) u=plus(u,times(this.ar,this.S[i][j],this.W[p][pos[j]]));

        for(let k=0;k<others.length;k++) u=plus(u,times(this.ar,this.S[i][others[k]],this.W[p][near[k]]));

  function nextInjection(a,n) {

      while(v<n&&used.has(v)) v++;

      return true;

  Model.prototype.frame=function(pos,remaining) { return {pos:pos.slice(),remaining:remaining.slice(),opened:false}; };
  Model.prototype.open=function(frame) {

  function Search(job,saved) {

        return;
      }
      const i=l.i,p=l.p; l.p++; if(l.p>=m.k) {l.p=0;l.i++;}
      if(s.best[i]===p) return;
      const j=s.best.indexOf(p); if(j>=0&&j<i) return;
      const pos=s.best.slice(); if(j>=0) pos[j]=pos[i]; pos[i]=p;
      if(!m.valid(pos)) return;
      const score=m.score(pos);
      if(m.cmp(score,this.localScore||this.bestScore)>0) {l.best=pos;this.localScore=score;}
      return;
    }
    if(!s.stack.length) {s.phase=s.best?'complete':'infeasible';return;}
    const f=s.stack[s.stack.length-1];
    if(!f.opened) {
      s.nodes++;
      if(!f.remaining.length) {
        const score=m.score(f.pos);
        if(!this.bestScore||m.cmp(score,this.bestScore)>0) {s.best=f.pos.slice();this.bestScore=score;}
        s.stack.pop();
        return;
      }
      if(s.phase==='exact'&&this.bestScore&&m.cmp(m.upper(f.pos),this.bestScore)<=0) {s.pruned++;s.stack.pop();return;}
      if(!m.open(f)) {s.pruned++;s.stack.pop();return;}
    }
    const child=m.child(f); if(child) s.stack.push(child); else s.stack.pop();
  };
  Search.prototype.summary=function() {
    if(this.summaryBest!==this.state.best) {
      this.summaryBest=this.state.best;
      this.summaryUtilities=this.state.best?this.model.utilities(this.state.best).map(v=>v.v):null;
    }
    return {phase:this.state.phase,nodes:this.state.nodes,pruned:this.state.pruned,
      best:this.state.best?this.state.best.slice():null,utilities:this.summaryUtilities||null,
      score:this.bestScore?this.bestScore.map(v=>v.v):null};
  };
  Search.prototype.save=function() { return {version:1,job:this.model.job,state:JSON.parse(JSON.stringify(this.state))}; };
  return {Search,Model,decimal,crossing,compare,Arithmetic,delta};
})();
